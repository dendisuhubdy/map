services:
  # Geocoding. Pinned to Photon 0.7.4 on Elasticsearch — the published country
  # extract is an ES index and will not load on the 1.x/OpenSearch line.
  # See docs/decisions/photon-index-source.md.
  photon:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    working_dir: /photon
    command: >
      java -Xmx4G -jar /photon/photon-${PHOTON_VERSION:-0.7.4}.jar
      -data-dir /photon -listen-ip 0.0.0.0 -listen-port 2322
    volumes:
      - ${DATA_DIR}/photon:/photon
    ports:
      - "127.0.0.1:2322:2322"
    mem_limit: 5g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://127.0.0.1:2322/api?q=test&limit=1' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR}/pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 1g
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  graphhopper:
    image: israelhikingmap/graphhopper:latest
    restart: unless-stopped
    # Do NOT use the image's default ENTRYPOINT (`./graphhopper.sh -c config-example.yml`).
    # A compose `command:` is appended to that entrypoint, and the wrapper script derives
    # its own graph directory from the input filename — it ignores `graph.location` from
    # our config. Observed: it re-imported from the PBF into a fresh /data/default-gh,
    # silently discarding the prepared graph (LM landmarks included) that `make graph`
    # had just spent ~25 minutes building, and never began serving.
    # Invoke the jar directly, exactly as the import does, so graph.location is honoured
    # and startup is a load (seconds) rather than an import.
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec java $${JAVA_OPTS} -jar /graphhopper/graphhopper-web-*.jar server /config/graphhopper.yml"]
    environment:
      JAVA_OPTS: "-Xmx6g -Xms2g"
    volumes:
      - ${DATA_DIR}:/data
      - ./config:/config
    ports:
      - "127.0.0.1:8989:8989"
    mem_limit: 7g

  tiles:
    image: protomaps/go-pmtiles:latest
    restart: unless-stopped
    command: ["serve","/data/tiles","--cors=*","--port=8080","--public-url=http://127.0.0.1:8080"]
    volumes:
      - ${DATA_DIR}/tiles:/data/tiles:ro
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g

  # The only service published on a public interface. Everything else binds to
  # 127.0.0.1 and is reachable only across the compose network; tests/smoke/test_edge.sh
  # asserts that. Certificates are issued by Let's Encrypt on first start and persist
  # in the caddy_data volume, so a restart does not re-request them.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 512m

volumes:
  caddy_data:
  caddy_config:
