services:
  # Geocoding. Pinned to Photon 0.7.4 on Elasticsearch — the published country
  # extract is an ES index and will not load on the 1.x/OpenSearch line.
  # See docs/decisions/photon-index-source.md.
  photon:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    working_dir: /photon
    command: >
      java -Xmx4G -jar /photon/photon-${PHOTON_VERSION:-0.7.4}.jar
      -data-dir /photon -listen-ip 0.0.0.0 -listen-port 2322
    volumes:
      - ${DATA_DIR}/photon:/photon
    ports:
      - "127.0.0.1:2322:2322"
    mem_limit: 5g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://127.0.0.1:2322/api?q=test&limit=1' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR}/pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 1g
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
